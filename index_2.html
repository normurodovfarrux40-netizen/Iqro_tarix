  .stat span{font-size:12px; color:var(--muted);}

/* ---------- Qulf ---------- */
function ochiqmi(t){
  if (t.requires_sub && !saqlangan.obuna) return {ok:false, sabab:'obuna'};
  if (t.is_paid){
    const ruxsat = saqlangan.kodlar.some(k => {
      const v = KODLAR[k];
      return v === 'all' || (Array.isArray(v) && v.includes(t.id));
    });
    if (!ruxsat) return {ok:false, sabab:'pullik'};
  }
  return {ok:true};
}

function engYaxshi(id){
  const r = saqlangan.natijalar.filter(x => x.id === id);
  return r.length ? Math.max(...r.map(x => x.foiz)) : null;
}

/* ---------- Navigatsiya ---------- */
function renderNav(){
  nav.innerHTML = SECTIONS.map(s =>
    `<button data-tab="${s.id}" class="${state.tab===s.id?'on':''}">${ICONS[s.icon]}<span>${s.label}</span></button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => { haptic(); go(b.dataset.tab); });
}
function go(tab){ state.tab = tab; state.quiz = null; clearInterval(timerId); renderNav(); scrollTo(0,0); render(); }

function render(){
  if (!saqlangan.ism) return kirish();      // ism yozilmagan bo‘lsa — kirish sahifasi
  nav.style.display = 'grid';
  renderNav();
  if (state.tab === 'bosh') return bosh();
  if (state.tab === 'reyting') return reyting();
  return bolim(state.tab);
}

/* ---------- Kirish: ism yozish ---------- */
function kirish(){
  nav.style.display = 'none';
  const tgIsm = TGUSER ? [TGUSER.first_name, TGUSER.last_name].filter(Boolean).join(' ') : '';
  root.innerHTML = `
    <div class="hero">${ICONS.emblem}
      <h2>Xush kelibsiz!</h2>
      <div class="small">Testni boshlashdan oldin ismingizni yozing.</div></div>

      <div class="names">Dilmurod Usmonov va Farrux Normurodov</div></div>

    <div class="card" style="margin-top:16px">
      <label class="small">Ism va familiya</label>
      <input id="ism" placeholder="Masalan: Alisher Rahimov" value="${esc(tgIsm)}"
             autocomplete="name" style="margin-top:6px">
      <label class="small" style="display:block;margin-top:12px">Maktab / sinf (ixtiyoriy)</label>
      <input id="maktab" placeholder="Masalan: 12-maktab, 9-A" style="margin-top:6px">
      <button class="primary full" style="margin-top:14px" onclick="kirishTasdiq()">Kirish</button>
      <div id="ismmsg" class="small" style="margin-top:8px"></div>
    </div>

    <div class="quote">«Tarixni bilmagan xalq — kelajagini qura olmaydi.»</div>`;
  const inp = document.getElementById('ism');
  inp.focus();
  inp.onkeydown = e => { if (e.key === 'Enter') kirishTasdiq(); };
}

function kirishTasdiq(){
  const ism = (document.getElementById('ism').value || '').trim();
  const maktab = (document.getElementById('maktab').value || '').trim();
  if (ism.length < 3){
    document.getElementById('ismmsg').textContent = '⚠️ Ism va familiyangizni to‘liq yozing.';
    return;
  }
  saqlangan.ism = ism; saqlangan.maktab = maktab; saqla();
  haptic('medium'); state.tab = 'bosh'; render();
}

function ismOzgartir(){
  saqlangan.ism = ''; saqla(); render();
}

      <h2>Assalomu alaykum, ${esc(saqlangan.ism)}!</h2>
      <div class="small">${saqlangan.maktab ? esc(saqlangan.maktab) + ' · ' : ''}Tarix fanidan
      bilimingizni sinang: testlar, olimpiada mashqlari va Milliy sertifikat namunalari.</div>
      <div class="small" style="margin-top:6px">
        <button onclick="ismOzgartir()" style="border:0;background:none;text-decoration:underline;font-size:13px;padding:2px">
          Ismni o‘zgartirish</button></div></div>

    <div class="authors"><div class="lbl">Mualliflar</div>
      <div class="names">Dilmurod Usmonov va Farrux Normurodov</div></div>

    <div class="stats">
      <div class="stat"><b>${n.length}</b><span>yechilgan test</span></div>
      <div class="stat"><b>${ball}</b><span>to‘plangan ball</span></div>
      <div class="stat"><b>${jami ? Math.round(ball/jami*100) : 0}%</b><span>aniqlik</span></div>
    </div>

    <div class="rule">${ICONS.scroll}</div>

    ${!saqlangan.obuna ? `
      <div class="card"><h3>${ICONS.lock} Kanalga a’zo bo‘ling</h3>
        <div class="desc">Testlarning aksari ${KANAL_NOMI} obunachilariga ochiq.</div>
        <a class="btn primary full" style="margin-top:10px" href="${KANAL}" target="_blank">A’zo bo‘lish</a>
        <button class="full" style="margin-top:8px" onclick="obunaTasdiq()">A’zo bo‘ldim ✓</button>
      </div>` : ''}

    <div class="card"><h3>${ICONS.testlar} Testlar</h3>
      <div class="desc">Mavzular bo‘yicha oddiy testlar.</div>
      <button class="primary full" style="margin-top:10px" onclick="go('testlar')">Boshlash</button></div>

    <div class="card"><h3>${ICONS.olimpiada} Olimpiada</h3>
      <div class="desc">Bosqichma-bosqich murakkablashuvchi savollar.</div>
      <button class="full" style="margin-top:10px" onclick="go('olimpiada')">Kirish</button></div>

    <div class="card"><h3>${ICONS.ms} Milliy sertifikat</h3>
      <div class="desc">Imtihon formatidagi tayyorgarlik testlari.</div>
      <button class="full" style="margin-top:10px" onclick="go('ms')">Kirish</button></div>

    <div class="card"><h3>${ICONS.pullik} Pullik testlar</h3>
      <div class="desc">Kengaytirilgan to‘plamlar. Kod orqali ochiladi.</div>
      <button class="full" style="margin-top:10px" onclick="go('pullik')">Ko‘rish</button></div>

    <div class="quote">«Tarixni bilmagan xalq — kelajagini qura olmaydi.»</div>
    <div class="rule">${ICONS.scroll}</div>
    <div class="center small">Iqro tarix testlari · ${BOT_NOMI}</div>`;
}

function obunaTasdiq(){
  saqlangan.obuna = true; saqla(); haptic('medium'); render();
}

/* ---------- Bo'lim ---------- */
function bolim(sec){
  const list = TESTLAR.filter(t => t.section === sec);
  if (!list.length){ root.innerHTML = `<h2>${NOMLAR[sec]}</h2><div class="empty">Bu bo‘limda hozircha test yo‘q.</div>`; return; }
  root.innerHTML = `<h2>${NOMLAR[sec]}</h2>` + list.map(karta).join('');
}

function karta(t){
  const a = ochiqmi(t), best = engYaxshi(t.id);
  const tags = [`<span class="tag">${t.questions.length} savol</span>`,
                `<span class="tag">${t.duration_min} daqiqa</span>`,
                t.era ? `<span class="tag">${esc(t.era)}</span>` : '',
                t.is_paid ? `<span class="tag fill">Pullik</span>` : '',
                best !== null ? `<span class="tag">Eng yaxshi: ${best}%</span>` : ''].join('');
  let act;
  if (a.ok) act = `<button class="primary full" style="margin-top:12px" onclick="boshla(${t.id})">Testni boshlash</button>`;
  else if (a.sabab === 'obuna') act = `<div class="lockmsg">Testni ochish uchun ${KANAL_NOMI} kanaliga a’zo bo‘ling.</div>
      <div class="btn-row"><a class="btn primary" href="${KANAL}" target="_blank">A’zo bo‘lish</a>
      <button onclick="obunaTasdiq()">A’zo bo‘ldim ✓</button></div>`;
  else act = `<div class="lockmsg">${esc(t.price_label || 'Bu test pullik. Kod orqali ochiladi.')}</div>
      <button class="full" style="margin-top:10px" onclick="kodSora()">Kod kiritish</button>`;
  return `<div class="card ${a.ok?'':'locked'}">
    <h3>${a.ok ? ICONS.scroll : ICONS.lock} ${esc(t.title)}</h3>
    ${t.description ? `<div class="desc">${esc(t.description)}</div>` : ''}
    <div class="tagrow">${tags}</div>${act}</div>`;
}

/* ---------- Kod ---------- */
function kodSora(){
  root.innerHTML = `<h2>Kod kiritish</h2>
    <div class="card">
      <div class="desc">Pullik testlarni ochish uchun administrator bergan kodni kiriting.</div>
      <div style="margin-top:10px"><input id="kod" placeholder="Masalan: IQRO2026" autocapitalize="characters"></div>
      <button class="primary full" style="margin-top:10px" onclick="kodTekshir()">Tasdiqlash</button>
      <div id="kodmsg" class="small" style="margin-top:8px"></div>
      <div class="small" style="margin-top:12px">Kod olish uchun ${BOT_NOMI} ga yozing.</div>
    </div>
    <button class="full" onclick="go('pullik')">Orqaga</button>`;
  document.getElementById('kod').focus();
}

function kodTekshir(){
  const v = (document.getElementById('kod').value || '').trim().toUpperCase();
  const msg = document.getElementById('kodmsg');
  if (KODLAR[v]){
    if (!saqlangan.kodlar.includes(v)) saqlangan.kodlar.push(v);
    saqla(); haptic('medium');
    msg.textContent = '✅ Kod qabul qilindi. Testlar ochildi.';
    setTimeout(() => go('pullik'), 700);
  } else {
    msg.textContent = '⚠️ Kod noto‘g‘ri.';
  }
}

/* ---------- Test ---------- */
let timerId = null;
function boshla(id){
  const t = TESTLAR.find(x => x.id === id);
  if (!t || !ochiqmi(t).ok) return;
  state.quiz = {t, i:0, javob:{}, start:Date.now(), tugash:Date.now() + t.duration_min*60000};
  savol();
}

function savol(){
  const q = state.quiz, item = q.t.questions[q.i], H = ['A','B','C','D','E','F'], sel = q.javob[q.i];
  root.innerHTML = `
    <div class="progress"><i style="width:${q.i/q.t.questions.length*100}%"></i></div>
    <div class="qhead"><span>${q.i+1} / ${q.t.questions.length}</span><span id="timer">--:--</span></div>
    <div class="qtext">${esc(item.text)}</div>
    <div>${item.options.map((o,i) =>
      `<button class="opt ${sel===i?'sel':''}" data-i="${i}"><span class="let">${H[i]}.</span>${esc(o)}</button>`).join('')}</div>
    <div class="btn-row">
      <button onclick="oldingi()" ${q.i===0?'disabled':''}>← Oldingi</button>
      ${q.i === q.t.questions.length-1
        ? `<button class="primary" onclick="yakunla()">Yakunlash</button>`
        : `<button class="primary" onclick="keyingi()">Keyingi →</button>`}</div>
    <div class="center small" style="margin-top:14px">
      <button onclick="chiq()" style="border:0;background:none;text-decoration:underline">Testdan chiqish</button></div>`;
  root.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    haptic(); q.javob[q.i] = +b.dataset.i;
    root.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
  });
  taymer();
}

function taymer(){
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (!state.quiz) return clearInterval(timerId);
    const q = Math.max(0, state.quiz.tugash - Date.now()), el = document.getElementById('timer');
    if (el){ const m = Math.floor(q/60000), s = Math.floor(q%60000/1000);
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
    if (q <= 0){ clearInterval(timerId); yakunla(true); }
  }, 500);
}

function keyingi(){ state.quiz.i++; savol(); scrollTo(0,0); }
function oldingi(){ state.quiz.i--; savol(); scrollTo(0,0); }
function chiq(){
  const ok = () => { clearInterval(timerId); state.quiz = null; go(state.tab); };
  if (tgApp?.showConfirm) tgApp.showConfirm('Testdan chiqasizmi? Natija saqlanmaydi.', r => r && ok());
  else if (confirm('Testdan chiqasizmi?')) ok();
}

function yakunla(avto){
  const q = state.quiz; if (!q) return;
  clearInterval(timerId);
  const H = ['A','B','C','D','E','F'];
  let ball = 0;
  const tahlil = q.t.questions.map((item,i) => {
    const berilgan = q.javob[i], togri = berilgan === item.correct;
    if (togri) ball++;
    return {...item, berilgan, togri};
  });
  const jami = q.t.questions.length, foiz = Math.round(ball/jami*1000)/10;
  saqlangan.natijalar.push({id:q.t.id, nom:q.t.title, ball, jami, foiz, sana:Date.now()});
  saqla();
  const baho = foiz >= 86 ? 'A’lo' : foiz >= 71 ? 'Yaxshi' : foiz >= 56 ? 'Qoniqarli' : 'Takrorlash kerak';
  const tid = q.t.id, sec = q.t.section;
  state.quiz = null;
  root.innerHTML = `
    ${avto ? '<div class="lockmsg">Vaqt tugadi — javoblaringiz avtomatik qabul qilindi.</div>' : ''}
    <div class="score">
      <div style="font-size:18px"><b>${esc(saqlangan.ism)}</b></div>
      ${saqlangan.maktab ? `<div class="small">${esc(saqlangan.maktab)}</div>` : ''}
      <div class="small" style="margin-top:4px">${esc(q.t.title)}</div>
      <div class="big">${ball}/${jami}</div><div>${foiz}% · <b>${baho}</b></div></div>
    <button class="full" onclick="natijaNusxa(${ball},${jami},${foiz},'${esc(q.t.title).replace(/'/g,"\\'")}')">
      Natijani nusxalash</button>
    <div class="btn-row"><button onclick="boshla(${tid})">Qayta yechish</button>
      <button class="primary" onclick="go('reyting')">Natijalarim</button></div>
    <div class="rule">${ICONS.scroll}</div>
    <h3>Javoblar tahlili</h3>
    <div class="review">${tahlil.map((d,n) => `
      <div class="q"><div><b>${n+1}. ${esc(d.text)}</b></div>
        ${d.options.map((o,i) => {
          const cls = i === d.correct ? 'correct' : (i === d.berilgan ? 'wrong' : '');
          return `<div class="opt ${cls}" style="cursor:default"><span class="let">${H[i]}.</span>${esc(o)}</div>`;
        }).join('')}
        ${d.explanation ? `<div class="exp">${esc(d.explanation)}</div>` : ''}</div>`).join('')}</div>
    <button class="full" onclick="go('${sec}')">Bo‘limga qaytish</button>`;
  scrollTo(0,0);
}

/* Natijani matn ko‘rinishida nusxalash — o‘quvchi ustoziga yuboradi */
function natijaNusxa(ball, jami, foiz, nom){
  const matn = `📜 Iqro tarix testlari\n\n` +
    `O‘quvchi: ${saqlangan.ism}\n` +
    (saqlangan.maktab ? `Maktab/sinf: ${saqlangan.maktab}\n` : '') +
    `Test: ${nom}\nNatija: ${ball}/${jami} (${foiz}%)\n` +
    `Sana: ${new Date().toLocaleDateString('uz-UZ')}`;
  const ok = () => alertUz('Natija nusxalandi. Endi ustozingizga yuborishingiz mumkin.');
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(matn).then(ok, () => alertUz(matn));
  else alertUz(matn);
}

/* ---------- Natijalar ---------- */
function reyting(){
  const n = [...saqlangan.natijalar].reverse();
  if (!n.length){
    root.innerHTML = `<h2>Natijalarim</h2><div class="empty">Hozircha natija yo‘q. Birinchi testni yeching!</div>`;
    return;
  }
  const ball = n.reduce((a,b) => a+b.ball, 0), jami = n.reduce((a,b) => a+b.jami, 0);
  root.innerHTML = `<h2>Natijalarim</h2>
    <div class="small" style="margin-bottom:10px"><b>${esc(saqlangan.ism)}</b>${saqlangan.maktab ? ' · ' + esc(saqlangan.maktab) : ''}</div>
    <div class="stats">
      <div class="stat"><b>${n.length}</b><span>urinish</span></div>
      <div class="stat"><b>${ball}</b><span>ball</span></div>
      <div class="stat"><b>${Math.round(ball/jami*100)}%</b><span>o‘rtacha</span></div>
    </div>
    <table style="margin-top:14px"><thead><tr><th>Test</th><th>Natija</th><th>%</th></tr></thead>
      <tbody>${n.slice(0,30).map(r => `<tr><td>${esc(r.nom)}</td><td>${r.ball}/${r.jami}</td><td>${r.foiz}%</td></tr>`).join('')}</tbody>
    </table>
    <div class="small center" style="margin-top:12px">Natijalar shu qurilmada saqlanadi.</div>
    <button class="full" style="margin-top:12px" onclick="tozala()">Natijalarni tozalash</button>`;
}

function tozala(){
  const ok = () => { saqlangan.natijalar = []; saqla(); reyting(); };
  if (tgApp?.showConfirm) tgApp.showConfirm('Barcha natijalar o‘chirilsinmi?', r => r && ok());
  else if (confirm('Barcha natijalar o‘chirilsinmi?')) ok();
}

/* ---------- Ishga tushirish ---------- */
Object.assign(window, {go, boshla, keyingi, oldingi, yakunla, chiq, obunaTasdiq, kodSora,
  kodTekshir, tozala, kirishTasdiq, ismOzgartir, natijaNusxa});
render();
</script>
</body>
</html>
